<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LB Transportes — Dashboard</title><style>body{font:16px Arial;background:#0b0e14;color:#e8edf5;max-width:1000px;margin:auto;padding:24px}.box,.card{background:#151c29;border:1px solid #26344a;border-radius:12px;padding:16px;margin:10px 0}select{padding:10px;background:#0d1420;color:white;border:1px solid #26344a;border-radius:8px}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{min-width:150px}.value{font-size:26px;font-weight:bold;color:#4ade80}.red{color:#f87171}table{width:100%;padding:12px}td,th{padding:12px;text-align:left;border-bottom:1px solid #26344a}</style></head><body><h1>LB Transportes</h1><div id="period"></div><div class="box">MÊS <select id="month"></select> ANO <select id="year"><option selected>2026</option><option>2025</option><option>2027</option></select> MOTORISTA <select id="driver"><option value="todos">Todos</option><option value="cristiano">Cristiano Mutakaia</option><option value="unai">Unai</option><option value="amauri">Amauri</option></select></div><div class="cards"><div class="card">ENTREGAS<div id="deliveries" class="value">0</div></div><div class="card">FALHADOS<div id="failed" class="value">0</div></div><div class="card">PENDENTES<div id="pending" class="value">0</div></div><div class="card">COMBUSTÍVEL<div id="fuel" class="value red">0</div></div></div><div class="box"><table><thead><tr><th>Motorista</th><th>Entregues</th><th>Falhados</th><th>Pendentes</th><th>Combustível</th></tr></thead><tbody id="rows"></tbody></table></div><script>const ms=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'],z=()=>({deliveries:0,failed:0,pending:0,fuel:0}),d={Julho:{cristiano:{deliveries:88,failed:4,pending:0,fuel:170},unai:{deliveries:77,failed:4,pending:1,fuel:105.65},amauri:z()},Agosto:{cristiano:{deliveries:0,failed:0,pending:0,fuel:30},unai:z(),amauri:z()}},n={cristiano:'Cristiano Mutakaia',unai:'Unai',amauri:'Amauri'},m=document.querySelector('#month');ms.forEach(x=>m.add(new Option(x,x)));m.value='Julho';function u(){let a=d[m.value]||{cristiano:z(),unai:z(),amauri:z()},k=document.querySelector('#driver').value,l=k==='todos'?Object.entries(a):[[k,a[k]]],t=z();document.querySelector('#rows').innerHTML=l.map(([q,v])=>{Object.keys(t).forEach(x=>t[x]+=v[x]);return `<tr><td>${n[q]}</td><td>${v.deliveries}</td><td>${v.failed}</td><td>${v.pending}</td><td class="red">€ ${v.fuel.toFixed(2)}</td></tr>`}).join('');['deliveries','failed','pending','fuel'].forEach(x=>document.querySelector('#'+x).textContent=x==='fuel'?'€ '+t[x].toFixed(2):t[x]);document.querySelector('#period').textContent=m.value+' 2026'}m.onchange=u;year.onchange=u;driver.onchange=u;u()</script></body></html>
