<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luna Transporte — Dashboard</title><style>body{font:16px Arial;background:#0b0e14;color:#e8edf5;max-width:1050px;margin:auto;padding:24px}.box,.card{background:#151c29;border:1px solid #26344a;border-radius:12px;padding:16px;margin:10px 0}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{min-width:150px}.value{font-size:26px;font-weight:bold;color:#4ade80}.red{color:#f87171}input,select,button{padding:10px;background:#0d1420;color:white;border:1px solid #52627a;border-radius:8px;margin:4px}button{cursor:pointer;background:#2563eb;border:0}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid #26344a}.muted{color:#9caac0}.hidden{display:none}</style></head><body><h1>Luna Transporte</h1><div id="app"><div class="box"><br>MÊS <select id="month"><option value="08">Agosto 2026</option><option value="09">Setembro 2026</option></select> MOTORISTA <select id="driver"><option>Todos</option><option>Cristiano Mutakaia</option><option>Unai</option><option>Amauri</option><option>Jheffy</option></select></div><div class="cards"><div class="card">ENTREGAS<div id="deliveries" class="value">0</div></div><div class="card">FALHADOS<div id="failed" class="value">0</div></div><div class="card">PENDENTES<div id="pending" class="value">0</div></div><div class="card">COMBUSTÍVEL<div id="fuel" class="value red">€ 0,00</div></div></div><div class="box"><table><thead><tr><th>Motorista</th><th>Entregues</th><th>Falhados</th><th>Pendentes</th><th>Combustível</th></tr></thead><tbody id="rows"></tbody></table></div><div class="box"><h2>Detalhes diários</h2><table><thead><tr><th>Data</th><th>Motorista</th><th>Entregues</th><th>Falhados</th><th>Pendentes</th><th>Combustível</th></tr></thead><tbody id="daily"></tbody></table></div></div><script>const API='https://gpoyrzjzazyojsgzsivs.supabase.co/rest/v1/daily_records',KEY='sb_publishable_JBUTh-emqbbfAOMsaQZv3w_B9wV8oSG',month=document.querySelector('#month'),driver=document.querySelector('#driver'),deliveries=document.querySelector('#deliveries'),failed=document.querySelector('#failed'),pending=document.querySelector('#pending'),fuel=document.querySelector('#fuel'),rows=document.querySelector('#rows'),daily=document.querySelector('#daily'),num=x=>Number(x||0),eur=x=>'€ '+(num(x)/100).toFixed(2).replace('.',',');async function load(){let start='2026-'+month.value+'-01',end=month.value==='08'?'2026-08-31':'2026-09-30',u=API+'?select=record_date,driver,delivered,failed,pending,fuel_cents&record_date=gte.'+start+'&record_date=lte.'+end+'&order=record_date';try{let r=await fetch(u,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}}),data=await r.json();if(!r.ok)throw Error();let use=driver.value==='Todos'?data:data.filter(x=>x.driver===driver.value),tot={delivered:0,failed:0,pending:0,fuel_cents:0},by={};use.forEach(x=>{['delivered','failed','pending','fuel_cents'].forEach(k=>tot[k]+=num(x[k]));by[x.driver]??={delivered:0,failed:0,pending:0,fuel_cents:0};['delivered','failed','pending','fuel_cents'].forEach(k=>by[x.driver][k]+=num(x[k]))});deliveries.textContent=tot.delivered;failed.textContent=tot.failed;pending.textContent=tot.pending;fuel.textContent=eur(tot.fuel_cents);rows.innerHTML=Object.entries(by).map(([n,v])=>'<tr><td>'+n+'</td><td>'+v.delivered+'</td><td>'+v.failed+'</td><td>'+v.pending+'</td><td class="red">'+eur(v.fuel_cents)+'</td></tr>').join('');daily.innerHTML=use.map(x=>'<tr><td>'+x.record_date+'</td><td>'+x.driver+'</td><td>'+x.delivered+'</td><td>'+x.failed+'</td><td>'+x.pending+'</td><td>'+eur(x.fuel_cents)+'</td></tr>').join('')}catch(e){console.error(e)}}month.onchange=load;driver.onchange=load;load();</script></body></html>
