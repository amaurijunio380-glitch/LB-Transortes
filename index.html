<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LB Transportes — Dashboard</title><style>body{font:16px Arial;background:#0b0e14;color:#e8edf5;max-width:1000px;margin:auto;padding:24px}.box,.card{background:#151c29;border:1px solid #26344a;border-radius:12px;padding:16px;margin:10px 0}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{min-width:150px}.value{font-size:26px;font-weight:bold;color:#4ade80}.red{color:#f87171}select{padding:10px;background:#0d1420;color:white;border:1px solid #26344a;border-radius:8px}table{width:100%;padding:12px}td,th{padding:12px;text-align:left;border-bottom:1px solid #26344a}h2{font-size:18px}</style></head><body><h1>LB Transportes</h1><div id="period"></div><div class="box">MÊS <select id="month"></select> ANO <select id="year"><option selected>2026</option><option>2025</option><option>2027</option></select> MOTORISTA <select id="driver"><option>Todos</option><option>Cristiano Mutakaia</option><option>Unai</option><option>Amauri</option><option>Jheffy</option></select></div><div class="cards"><div class="card">ENTREGAS<div id="deliveries" class="value">0</div></div><div class="card">FALHADOS<div id="failed" class="value">0</div></div><div class="card">PENDENTES<div id="pending" class="value">0</div></div><div class="card">COMBUSTÍVEL<div id="fuel" class="value red">€ 0,00</div></div></div><div class="box"><table><thead><tr><th>Motorista</th><th>Entregues</th><th>Falhados</th><th>Pendentes</th><th>Combustível</th></tr></thead><tbody id="rows"></tbody></table></div><div class="box"><h2>Detalhes diários por motorista</h2><table><thead><tr><th>Data</th><th>Motorista</th><th>Entregues</th><th>Falhados</th><th>Pendentes</th><th>Combustível</th></tr></thead><tbody id="daily"></tbody></table></div><script>const id='1s5euiV7D9CS1dc4BUQDGEet2zfHpe4KcxffTG1EGeqM',names=['Cristiano Mutakaia','Unai','Amauri','Jheffy'],ms=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'],g=[1478429976,1532300243,648225240,1758123207,1379220021,1196496381,348226936,375469998,1319915691,163588775,169955009,40084425],m=document.querySelector('#month');ms.forEach(x=>m.add(new Option(x,x)));m.value='Agosto';const num=x=>{let s=String(x??'').replace(/[€\s\u00a0]/g,'').replace(',','.');return parseFloat(s)||0},z=()=>({deliveries:0,failed:0,pending:0,fuel:0});async function u(){const s=m.selectedIndex,t=await fetch(`https://docs.google.com/spreadsheets/d/${id}/export?format=csv&gid=${g[s]}&t=${Date.now()}`),x=await t.text(),a={},d=[];x.trim().split(/\r?\n/).slice(2).forEach(r=>{let v=r.split(',').map(x=>x.replace(/^"|"$/g,'')),n=v[0];if(names.includes(n))a[n]={deliveries:num(v[1]),failed:num(v[2]),pending:num(v[3]),fuel:num(v[4])};else if(/^\d{2}\/\d{2}\/\d{4}$/.test(n)&&names.includes(v[1]))d.push([n,v[1],v[2],v[3],v[4],v[5]||0])});let k=driver.value,l=k==='Todos'?Object.entries(a):[[k,a[k]||z()]],q=z();rows.innerHTML=l.map(([n,v])=>{Object.keys(q).forEach(x=>q[x]+=v[x]);return `<tr><td>${n}</td><td>${v.deliveries}</td><td>${v.failed}</td><td>${v.pending}</td><td class="red">€ ${v.fuel.toFixed(2).replace('.',',')}</td></tr>`}).join('');daily.innerHTML=d.map(v=>`<tr><td>${v[0]}</td><td>${v[1]}</td><td>${v[2]}</td><td>${v[3]}</td><td>${v[4]}</td><td>€ ${num(v[5]).toFixed(2).replace('.',',')}</td></tr>`).join('');['deliveries','failed','pending'].forEach(x=>document.querySelector('#'+x).textContent=q[x]);fuel.textContent='€ '+q.fuel.toFixed(2).replace('.',',');period.textContent=m.value+' '+year.value}m.onchange=u;driver.onchange=u;year.onchange=u;u();</script></body></html>
