<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LB Transportes — Dashboard</title><style>body{font:16px Arial;background:#0b0e14;color:#e8edf5;max-width:1000px;margin:auto;padding:24px}.box,.card{background:#151c29;border:1px solid #26344a;border-radius:12px;padding:16px;margin:10px 0}select{padding:10px;background:#0d1420;color:white;border:1px solid #26344a;border-radius:8px}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{min-width:150px}.value{font-size:26px;font-weight:bold;color:#4ade80}.red{color:#f87171}table{width:100%;padding:12px}td,th{padding:12px;text-align:left;border-bottom:1px solid #26344a}</style></head><body><h1>LB Transportes</h1><div id="period"></div><div class="box">MÊS <select id="month"></select> ANO <select id="year"><option selected>2026</option><option>2025</option><option>2027</option></select> MOTORISTA <select id="driver"><option value="todos">Todos</option><option value="Cristiano Mutakaia">Cristiano Mutakaia</option><option value="Unai">Unai</option><option value="Amauri">Amauri</option></select></div><div class="cards"><div class="card">ENTREGAS<div id="deliveries" class="value">0</div></div><div class="card">FALHADOS<div id="failed" class="value">0</div></div><div class="card">PENDENTES<div id="pending" class="value">0</div></div><div class="card">COMBUSTÍVEL<div id="fuel" class="value red">€ 0,00</div></div></div><div class="box"><table><thead><tr><th>Motorista</th><th>Entregues</th><th>Falhados</th><th>Pendentes</th><th>Combustível</th></tr></thead><tbody id="rows"></tbody></table></div><script>const id='1s5euiV7D9CS1dc4BUQDGEet2zfHpe4KcxffTG1EGeqM',ms=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'],m=document.querySelector('#month');ms.forEach(x=>m.add(new Option(x,x)));m.value='Julho';const z=()=>({deliveries:0,failed:0,pending:0,fuel:0});async function u(){const s=m.value,t=await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(s)}&v=6`),x=await t.text(),j=JSON.parse(x.slice(x.indexOf('{'),x.lastIndexOf('}')+1)),a={};(j.table.rows||[]).forEach(r=>{let v=r.c||[],n=v[0]?.v;if(['Cristiano Mutakaia','Unai','Amauri'].includes(n))a[n]={deliveries:+(v[1]?.v||0),failed:+(v[2]?.v||0),pending:+(v[3]?.v||0),fuel:parseFloat(String(v[4]?.v||0).replace(',','.'))||0}});let k=document.querySelector('#driver').value,l=k==='todos'?Object.entries(a):[[k,a[k]||z()]],q=z();document.querySelector('#rows').innerHTML=l.map(([n,v])=>{Object.keys(q).forEach(x=>q[x]+=v[x]);return `<tr><td>${n}</td><td>${v.deliveries}</td><td>${v.failed}</td><td>${v.pending}</td><td class="red">€ ${v.fuel.toFixed(2)}</td></tr>`}).join('');['deliveries','failed','pending'].forEach(x=>document.querySelector('#'+x).textContent=q[x]);document.querySelector('#fuel').textContent='€ '+q.fuel.toFixed(2);document.querySelector('#period').textContent=s+' '+year.value}m.onchange=u;driver.onchange=u;year.onchange=u;u();</script></body></html>
